      <!-- ========== 12 · A READ, STEP BY STEP ========== -->
      <section class="slide">
        <!-- NOTES: The read loop in detail, and note there is only ever one store. 1 the component subscribes. 2 useLiveQuery registers the live query against the TanStack DB collection. 3 the collection answers immediately from local state. 4 if that shape isn't subscribed yet the collection opens a ShapeStream to your authorization proxy — and a shape is just a filtered subset of a table, a WHERE clause the server pins, which is the whole of the next slide — 5 the proxy authenticates and forwards the authorized shape to the Electric sync engine, 6 Electric takes an initial snapshot and then follows Postgres logical replication, 7 snapshot then live changes stream back down through the proxy into the same collection, 8 the live query updates incrementally and the component re-renders. Steps 6 to 8 never stop — sync continues in the background for as long as the shape is subscribed. -->
