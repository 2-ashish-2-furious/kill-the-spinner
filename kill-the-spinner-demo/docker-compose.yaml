name: "tanstack-start-db-electric-starter"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: electric
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - 54323:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp
    command:
      - -c
      - listen_addresses=*
      - -c
      - wal_level=logical

  electric:
    image: electricsql/electric:latest
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/electric?sslmode=disable
      # Not suitable for production.
      # See https://electric-sql.com/docs/guides/security
      ELECTRIC_INSECURE: true
    ports:
      - 30000:3000
    # Guardrail against the OOM (exit 137) that killed this container while
    # serving the 500k-row demo shape alongside other local stacks. Give Electric
    # a headroom ceiling and restart it automatically if it is killed anyway.
    mem_limit: 2g
    mem_reservation: 512m
    restart: unless-stopped
    depends_on:
      - postgres

volumes:
  postgres_data:
